<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Inline vs InPage vs Seperate Page</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
      }
      .container {
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
        background-color: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="container" id="container" document.getElementById 5px solid #333';>
      <h1>JS Inline vs InPage vs Separate Page</h1>
      <p>
        This is a simple example to demonstrate the differences between inline,
        in-page, and separate page JavaScript.
      </p>
    </div>
    <script>
      // Inline JavaScript
      document.getElementById('container').style.border = '2px solid #333';
      </script>
  </body>
</html>
