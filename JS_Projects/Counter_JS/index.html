<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2 class="heading1">Welcome to JS Counter App</h2>
    <p class="paragraph1">This is a Website Build on HTML, CSS & JS and it work as Counter. There are Three Button and
        current Count Score and One button Rest the Count to Zero(0), Second Button Add 1 to the Count and Third Button
        Subtract 1 for the Count</p>
    <div class="box1" id="score">
        <span class="paragraph2"><span id="scorevalue">0</span> Count</span>
    </div>
    <div class="box2">
        <button id="button2" onclick="add()">Add 1</button>
        <button id="button1" onclick="rest()">Reset the Count</button>
        <button id="button3" onclick="subtract()">Subtract 1</button>
    </div>
    <script src="app.js"></script>
</body>

</html>
